<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette Suivi Pro</title>
<style>
/* ─── Charte : jetons ───────────────────────────────────────────── */
:root{
  --fond:#f5f5f7; --surface:#ffffff; --surface-2:#f0f0f4; --side:#ededf1;
  --trait:rgba(60,60,67,.14); --texte:#1d1d1f; --doux:#6e6e73; --discret:#8e8e93;
  --accent:#0a66d9; --accent-texte:#0062cc; --accent-teinte:rgba(0,122,255,.10);
  --ok:#1f7a4d; --ok-teinte:rgba(52,199,89,.15);
  --att:#a54a00; --att-teinte:rgba(255,149,0,.16);
  --err:#c4000f; --err-teinte:rgba(255,59,48,.12);
  --neutre-teinte:rgba(120,120,128,.12);
  --ombre:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  --rayon:14px; --rayon-champ:10px;
  --t-meta:13px; --t-corps:15px; --t-titre:17px; --t-page:26px;
  /* N° de commande : 3 teintes qui tournent (1 rouge, 2 bleu, 3 vert, 4 rouge…) — même règle que l'outil actuel */
  --num1:#c4000f; --num1-fond:rgba(255,59,48,.12); --num2:#0062cc; --num2-fond:rgba(0,122,255,.12); --num3:#1f7a4d; --num3-fond:rgba(52,199,89,.16);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --fond:#111113; --surface:#1c1c1e; --surface-2:#2c2c2e; --side:#18181a;
  --trait:rgba(255,255,255,.12); --texte:#f5f5f7; --doux:#a1a1a6; --discret:#8e8e93;
  --accent:#1a6fe0; --accent-texte:#5aa9ff; --accent-teinte:rgba(10,132,255,.18);
  --ok:#4cc38a; --ok-teinte:rgba(48,209,88,.18);
  --att:#ffb340; --att-teinte:rgba(255,159,10,.18);
  --err:#ff6961; --err-teinte:rgba(255,69,58,.18);
  --neutre-teinte:rgba(160,160,170,.16);
  --ombre:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  --num1:#ff6961; --num1-fond:rgba(255,69,58,.22); --num2:#5aa9ff; --num2-fond:rgba(10,132,255,.24); --num3:#4cc38a; --num3-fond:rgba(48,209,88,.22);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --fond:#111113; --surface:#1c1c1e; --surface-2:#2c2c2e; --side:#18181a;
  --trait:rgba(255,255,255,.12); --texte:#f5f5f7; --doux:#a1a1a6; --discret:#8e8e93;
  --accent:#1a6fe0; --accent-texte:#5aa9ff; --accent-teinte:rgba(10,132,255,.18);
  --ok:#4cc38a; --ok-teinte:rgba(48,209,88,.18); --att:#ffb340; --att-teinte:rgba(255,159,10,.18);
  --err:#ff6961; --err-teinte:rgba(255,69,58,.18); --neutre-teinte:rgba(160,160,170,.16);
  --ombre:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4); color-scheme:dark;
  --num1:#ff6961; --num1-fond:rgba(255,69,58,.22); --num2:#5aa9ff; --num2-fond:rgba(10,132,255,.24); --num3:#4cc38a; --num3-fond:rgba(48,209,88,.22);
}}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:var(--t-corps)/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;background:var(--fond);color:var(--texte)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ─── Composants ────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;
  font-weight:600;background:var(--surface-2);color:var(--texte);transition:background .12s}
.btn:hover{background:color-mix(in srgb,var(--texte) 9%,var(--surface-2))}
.btn-prim{background:var(--accent);color:#fff}
.btn-prim:hover{background:color-mix(in srgb,#000 12%,var(--accent))}
.btn-ghost{background:transparent;color:var(--accent-texte)}
.btn-ghost:hover{background:var(--accent-teinte)}
.btn-danger{background:var(--err-teinte);color:var(--err)}
.btn-bloc{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.icone-btn{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--doux)}
.icone-btn:hover{background:var(--surface-2);color:var(--texte)}

.champ{width:100%;min-height:44px;padding:10px 14px;border-radius:var(--rayon-champ);border:1px solid transparent;background:var(--surface-2);outline:none}
.champ:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-teinte);background:var(--surface)}
.etiquette{display:block;font-size:var(--t-meta);color:var(--doux);margin:0 0 6px;font-weight:500}

.puce{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-meta);color:var(--doux);white-space:nowrap}
.puce::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--discret)}
.puce.ok::before{background:var(--ok)} .puce.att::before{background:#ff9500} .puce.err::before{background:#ff3b30} .puce.info::before{background:#007aff}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--texte);color:var(--fond)}
.chip .n{opacity:.6;font-variant-numeric:tabular-nums}

.segment{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.segment button{min-height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--doux)}
.segment button[aria-pressed="true"]{background:var(--surface);color:var(--texte);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.liste{background:var(--surface);border-radius:var(--rayon);overflow:hidden}
.ligne{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 8px 10px 16px;position:relative;width:100%;text-align:left}
.ligne + .ligne::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--trait)}
button.ligne:hover,.ligne.cliquable:hover{background:color-mix(in srgb,var(--texte) 3%,transparent)}
.ligne[aria-current="true"]{background:var(--accent-teinte)}
.ligne .txt{flex:1;min-width:0}
.ligne .t1{font-weight:600;overflow-wrap:anywhere}
@media (min-width:768px){.ligne .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.ligne .t1 span{font-weight:400;color:var(--doux)}
.ligne .t2{font-size:var(--t-meta);color:var(--doux);margin-top:2px;font-variant-numeric:tabular-nums}
.groupe-titre{font-size:var(--t-meta);font-weight:600;color:var(--doux);margin:22px 4px 8px;text-transform:none}

.pointer{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pointer span{width:26px;height:26px;border-radius:50%;border:2px solid var(--trait);display:flex;align-items:center;justify-content:center}
.pointer[aria-pressed="true"] span{background:var(--ok);border-color:var(--ok);color:#fff}
.pointer svg{width:16px;height:16px;stroke-width:2.6;opacity:0}
.pointer[aria-pressed="true"] svg{opacity:1}

.barre{height:6px;border-radius:3px;background:var(--neutre-teinte);overflow:hidden}
.barre i{display:block;height:100%;background:#007aff;border-radius:3px}
.barre i.ok{background:var(--ok)}
.barre i.orange{background:#ff9500} .barre i.bleu{background:#007aff} .barre i.zero{width:0 !important}
.pc{font-weight:600} .pc.ok{color:var(--ok)} .pc.bleu{color:var(--accent-texte)} .pc.orange{color:var(--att)} .pc.zero{color:var(--discret)}
.num{display:inline-block;padding:0 7px;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.5}
.num.n1{background:var(--num1-fond);color:var(--num1)} .num.n2{background:var(--num2-fond);color:var(--num2)} .num.n3{background:var(--num3-fond);color:var(--num3)}
.ligne.faible .txt,.ligne.faible .puce{opacity:.5}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--texte);color:var(--fond);
  border-radius:14px;padding:12px 8px 12px 16px;display:none;align-items:center;gap:12px;max-width:min(520px,calc(100% - 24px));font-size:14px;z-index:60;box-shadow:var(--ombre)}
.toast.visible{display:flex}
.toast button{color:#4da3ff;font-weight:600;min-height:36px;padding:0 10px;border-radius:8px}
:root[data-theme="dark"] .toast button{color:#0062cc}

.encart{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.encart.att{background:var(--att-teinte);color:var(--att)}
.encart.info{background:var(--accent-teinte);color:var(--accent-texte)}
.encart.err{background:var(--err-teinte);color:var(--err)}
.vide{text-align:center;color:var(--doux);padding:48px 16px}

/* ─── Structure : barre latérale (≥ 768 px) / barre d'onglets (téléphone) ── */
.app{display:flex;min-height:100%}
.side{display:none}
.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--trait);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;font-weight:500;color:var(--discret);min-height:56px}
.tabbar button[aria-current="page"]{color:var(--accent-texte)}
.tabbar svg.i{width:24px;height:24px}
.page{padding:12px 16px calc(96px + env(safe-area-inset-bottom));max-width:980px;width:100%;margin:0 auto}
.entete{display:flex;align-items:center;gap:8px;min-height:52px;margin-bottom:8px}
.entete h1{font-size:var(--t-page);font-weight:700;letter-spacing:-.02em;margin:0;flex:1;line-height:1.15}
.entete .sous{font-size:var(--t-meta);color:var(--doux)}

@media (min-width:768px){
  .side{display:flex;flex-direction:column;width:248px;flex-shrink:0;background:var(--side);border-right:1px solid var(--trait);
    position:sticky;top:0;height:100vh;padding:14px 10px;overflow-y:auto}
  .tabbar{display:none}
  .page{padding:20px 28px 40px}
  .toast{bottom:24px}
  .action-flottante{display:none !important}
}
.marque-app{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:16px}
.marque-app b{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.magasin-btn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 12px;border-radius:10px;background:var(--surface);font-weight:600;font-size:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.magasin-btn .flex{flex:1;text-align:left}
.nav-titre{font-size:12px;font-weight:600;color:var(--discret);padding:14px 12px 4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:0 12px;border-radius:9px;font-size:15px;color:var(--texte);text-align:left}
.nav svg.i{width:20px;height:20px;color:var(--accent-texte)}
.nav:hover{background:color-mix(in srgb,var(--texte) 6%,transparent)}
.nav[aria-current="page"]{background:color-mix(in srgb,var(--texte) 10%,transparent);font-weight:600}
.nav .badge{margin-left:auto;font-size:12px;color:var(--doux);font-variant-numeric:tabular-nums}
.side .bas{margin-top:auto;padding-top:12px;border-top:1px solid var(--trait);display:flex;align-items:center;gap:10px;font-size:13px;color:var(--doux);padding-left:8px}

/* Action principale sur téléphone : en bas à droite, au-dessus des onglets (pouce) */
.action-flottante{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:41;box-shadow:0 6px 18px rgba(0,98,204,.35)}

/* ─── Cahier : liste + panneau (direction A, grand écran) ───────── */
.cahier{display:flex;gap:20px;align-items:flex-start}
.cahier .col-liste{flex:1;min-width:0}
.panneau{display:none}
@media (min-width:1100px){
  body[data-dir="A"] .panneau.ouvert{display:block;width:400px;flex-shrink:0;position:sticky;top:20px;background:var(--surface);border-radius:var(--rayon);
    box-shadow:var(--ombre);max-height:calc(100vh - 40px);overflow-y:auto}
  body[data-dir="A"] .page.large{max-width:1320px}
}
.feuille-fond{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50;display:none}
.feuille-fond.ouvert{display:block}
.feuille{position:fixed;z-index:51;background:var(--surface);display:none;flex-direction:column;inset:0}
.feuille.ouvert{display:flex}
@media (min-width:768px){
  .feuille{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 48px));max-height:calc(100% - 48px);border-radius:18px;box-shadow:var(--ombre)}
}
.feuille-entete{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--trait);min-height:56px}
.feuille-entete h2{flex:1;margin:0;font-size:var(--t-titre);font-weight:700}
.feuille-corps{flex:1;overflow-y:auto;padding:16px}
.feuille-pied{border-top:1px solid var(--trait);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;background:var(--surface)}
.feuille-pied .total{flex:1;font-size:14px;color:var(--doux);line-height:1.3}
.feuille-pied .total b{display:block;color:var(--texte);font-size:var(--t-titre)}

/* Grille de pointures « au tapotement » */
.pointures{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.pt{position:relative;min-height:64px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:600;font-size:16px;user-select:none;-webkit-user-select:none;touch-action:manipulation;border:2px solid transparent}
.pt small{font-size:11px;font-weight:500;color:var(--discret);margin-top:1px}
.pt .qte{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:#1f7a4d;color:#fff;font-size:13px;display:none;align-items:center;justify-content:center;padding:0 6px}
.pt.plein{background:var(--ok-teinte);border-color:var(--ok)}
.pt.plein .qte{display:flex}
.pt.retour.plein{background:var(--att-teinte);border-color:#ff9500}
.pt.retour .qte{background:#d97706}

.resume{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--doux);align-items:center}
.resume b{color:var(--texte);font-weight:600}
.lien{color:var(--accent-texte);font-weight:600;font-size:14px;min-height:36px;padding:0 4px}

.carte{background:var(--surface);border-radius:var(--rayon);padding:16px}
.jour-agenda{font-size:var(--t-meta);font-weight:700;color:var(--accent-texte);padding:10px 16px 0}
.jour-agenda + .ligne::before{display:none}
.compteurs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.compteur{position:relative;overflow:hidden;background:var(--surface);border-radius:var(--rayon);padding:12px 14px 12px 18px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:72px}
.compteur::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.compteur b{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--c)}
.compteur em{font-style:normal;font-size:12px;font-weight:600;color:#f97316}
.compteur span{font-size:var(--t-meta);color:var(--doux)}
.compteur:hover{background:color-mix(in srgb,var(--texte) 3%,var(--surface))}
.pt-suivi{min-height:52px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.pt-suivi small{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.pt-suivi.ok{background:var(--ok-teinte)} .pt-suivi.ok small{color:var(--ok)}
.pt-suivi.part{background:var(--accent-teinte)} .pt-suivi.part small{color:var(--accent-texte)}
.pt-suivi.zero small{color:var(--discret)}
.resume-global{display:flex;align-items:center;gap:16px;margin:12px 0 4px}
.resume-global .grand{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:84px}
select.champ{appearance:auto}
.grille-accueil{display:grid;gap:20px}
@media (min-width:1000px){.grille-accueil{grid-template-columns:1.4fr 1fr}}
.action-rapide{display:flex;gap:10px;flex-wrap:wrap}

.connexion{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.connexion .carte{width:100%;max-width:380px;padding:28px 24px;box-shadow:var(--ombre)}
</style>
</head>

  <symbol id="i-accueil" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>

  <symbol id="i-sav" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></symbol>
  <symbol id="i-commande" viewBox="0 0 24 24"><path d="M6 2h12l2 5H4z"/><path d="M4 7h16v14H4z"/><path d="M9 11a3 3 0 0 0 6 0"/></symbol>
  <symbol id="i-repertoire" viewBox="0 0 24 24"><path d="M5 3h13a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5z"/><circle cx="12" cy="10" r="3"/><path d="M7.5 17c.8-2 2.4-3 4.5-3s3.7 1 4.5 3M3 7h3M3 12h3M3 17h3"/></symbol>
  <symbol id="i-planning" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></symbol>
  <symbol id="i-paie" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h5"/></symbol>
  <symbol id="i-achats" viewBox="0 0 24 24"><path d="M3 3h2l2.5 12h11L21 7H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></symbol>

function libelleJour(iso) {
  const auj = MAINTENANT.slice(0, 10)
  const d = new Date(iso + 'T12:00'), a = new Date(auj + 'T12:00')
  const ecart = Math.round((d - a) / 86400000)
  if (ecart === 0) return "Aujourd'hui"
  if (ecart === 1) return 'Demain'
  return `${JOURS_SEM[d.getDay()]} ${d.getDate()}` + (ecart > 6 ? ' octobre' : '')
}
function evenementsAVenir(max = 4) {
  const auj = MAINTENANT.slice(0, 10), heure = MAINTENANT.slice(11)
  const tries = EVENEMENTS.slice().sort((x, y) => (x.date + (x.debut || '00:00')).localeCompare(y.date + (y.debut || '00:00')))

  const restantAuj = tries.filter(e => e.date === auj && (!e.fin || e.fin > heure))
  return [...restantAuj, ...tries.filter(e => e.date > auj)].slice(0, max)
}

}

function vueLivraisons() {
  const mags = etat.livMag === 'tous' ? Object.keys(LIVRAISONS) : [etat.livMag]
  const q = etat.livQ.trim().toLowerCase()
  const passe = b => etat.livFiltre === 'toutes' || (etat.livFiltre === 'encours' && b.recu > 0 && b.recu < b.attendu)
    || (etat.livFiltre === 'completes' && b.recu >= b.attendu) || (etat.livFiltre === 'nonrecues' && b.recu === 0)
  const blocs = mags.map(mag => ({ mag, marques: LIVRAISONS[mag]
    .map(b => ({ ...b, recu: b.modeles.reduce((t, m) => t + somme(m.recu), 0), attendu: b.modeles.reduce((t, m) => t + somme(m.attendu), 0) }))
    .filter(b => (!q || b.marque.toLowerCase().includes(q)) && passe(b)) }))
  const tot = blocs.flatMap(b => b.marques).reduce((t, b) => ({ r: t.r + b.recu, a: t.a + b.attendu }), { r: 0, a: 0 })
  const pcG = tot.a ? Math.round(tot.r / tot.a * 100) : 0
  const chip = (k, l) => `<button class="chip" data-livf="${k}" aria-pressed="${etat.livFiltre === k}">${l}</button>`
  return `
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
    <select class="champ" data-livmag style="flex:1;min-width:180px;max-width:280px" aria-label="Magasin">
      ${Object.keys(LIVRAISONS).map(m => `<option value="${esc(m)}" ${etat.livMag === m ? 'selected' : ''}>${esc(m)}${m === MAGASIN_APPAREIL ? ' (cet appareil)' : ''}</option>`).join('')}

      <input class="champ" id="livq" placeholder="Rechercher une marque" value="${esc(etat.livQ)}" style="padding-left:40px" aria-label="Rechercher une marque">
    </div>
  </div>
  <div class="carte resume-global">
    <span class="grand pc ${niveau(pcG)}">${pcG} %</span>
    <span style="flex:1"><div class="barre" style="height:8px"><i class="${niveau(pcG)}" style="width:${Math.min(100, pcG)}%"></i></div>
      <div class="t2" style="margin-top:6px;color:var(--doux);font-size:var(--t-meta)"><b style="color:var(--texte)">${tot.r}</b> paires reçues sur <b style="color:var(--texte)">${tot.a}</b> attendues</div></span>
  </div>
  <div class="chips" style="margin:12px 0 0">${chip('toutes','Toutes')}${chip('encours','En cours')}${chip('completes','Complètes')}${chip('nonrecues','Non reçues')}</div>
  ${blocs.map(({ mag, marques }) => `
    <h2 class="groupe-titre">${esc(mag)} · Hiver 2026</h2>
    ${marques.length ? `<div class="liste">${marques.map(b => {
      const cle = mag + '|' + b.marque, ouvert = etat.livOuverte === cle, pc = b.attendu ? Math.round(b.recu / b.attendu * 100) : 0
      return `<button class="ligne ${b.recu === 0 ? 'faible' : ''}" data-liv="${esc(cle)}" aria-expanded="${ouvert}">
        <span class="txt"><span class="t1">${esc(b.marque)}</span>
          <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><div class="barre" style="flex:1"><i class="${niveau(pc)}" style="width:${Math.min(100, pc)}%"></i></div>
          <span class="t2" style="margin:0;min-width:120px;text-align:right">${b.recu} / ${b.attendu} paires · <span class="pc ${niveau(pc)}">${pc} %</span></span></div></span>
        ${ic(ouvert ? 'bas' : 'chevron', 'style="color:var(--discret)"')}</button>
        ${ouvert ? b.modeles.map(m => {
          const cm = cle + '|' + m.nom, mo = etat.livModele === cm, r = somme(m.recu), a = somme(m.attendu), p = a ? Math.round(r / a * 100) : 0
          return `<button class="ligne ${r === 0 ? 'faible' : ''}" data-livmod="${esc(cm)}" aria-expanded="${mo}" style="padding-left:32px;min-height:56px">
            <span class="txt"><span class="t1" style="font-weight:500">${esc(m.nom)} ${numHtml(m.numero)}</span>
              <div style="display:flex;align-items:center;gap:10px;margin-top:5px"><div class="barre" style="flex:1;height:5px"><i class="${niveau(p)}" style="width:${Math.min(100, p)}%"></i></div>
              <span class="t2" style="margin:0;min-width:120px;text-align:right">${r} / ${a} reçues${r < a ? ' · reste ' + (a - r) : ' · complet'}</span></div></span>
            ${ic(mo ? 'bas' : 'chevron', 'style="color:var(--discret);width:18px;height:18px"')}</button>
            ${mo ? `<div style="padding:4px 16px 14px 32px"><div class="pointures" style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr))">${Object.keys(m.attendu).map(t => {

              <div style="margin-top:8px;font-size:var(--t-meta);color:var(--doux)">Reçu / attendu par pointure — vert : complet, bleu : partiel, gris : rien reçu (comme l'outil actuel)</div></div>` : ''}`
        }).join('') : ''}`

    <div class="chips" style="flex-wrap:wrap;margin-bottom:12px">${CATEGORIES.map(c => `<button class="chip" data-cat="${c}" aria-pressed="${form.categorie === c}">${c}</button>`).join('')}</div>
    <span class="etiquette">Statut</span>
    ${retour ? `<div class="chips" style="margin-bottom:16px"><button class="chip" aria-pressed="true" disabled>Retour</button></div>`
      : `<div class="chips" style="flex-wrap:wrap;margin-bottom:16px">${[['','Aucun'], ...STATUTS.filter(x => x !== 'Retour').map(x => [x, x])].map(([v, l]) => `<button class="chip" data-statut-saisie="${v}" aria-pressed="${form.statut === v}">${v ? `<span class="puce ${STATUT_CLASSE[v]}" style="color:inherit">${l}</span>` : l}</button>`).join('')}</div>`}
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
      <span class="etiquette" style="margin:0">Touchez une pointure pour ${form.retirer ? 'retirer' : 'ajouter'} une paire</span>
      <div class="segment" role="group" aria-label="Ajouter ou retirer">
        <button data-act="mode-ajout" aria-pressed="${!form.retirer}" aria-label="Ajouter">+</button>
        <button data-act="mode-retrait" aria-pressed="${form.retirer}" aria-label="Retirer">−</button>
      </div>
    </div>
    <div class="pointures">${grille.map(t => {
      const q = form.qte[t] || 0, r = reste(t)
      const info = retour || !mod ? '&nbsp;' : r - q > 0 ? 'reste ' + (r - q) : q > r ? (r ? '+' + (q - r) + ' en plus' : 'non attendu') : '&nbsp;'
      return `<button class="pt ${q ? 'plein' : ''} ${retour ? 'retour' : ''}" data-pt="${t}">${t}<small>${info}</small><span class="qte">${retour ? '−' : ''}${q}</span></button>`
    }).join('')}</div>
    ${!retour ? `<div style="margin-top:10px"><button class="lien" data-act="tout-reste">Tout le reste à recevoir</button>${total ? ` · <button class="lien" data-act="vider">Vider</button>` : ''}</div>` : ''}` : ''}
  </div>
  <div class="feuille-pied">
    <div class="total"><b>${retour ? '−' : ''}${total} paire${total > 1 ? 's' : ''}</b>${prix ? (retour ? 'avoir ' : '') + fmtEur(prix * total) : 'Choisissez un modèle'}</div>
    <button class="btn btn-prim" data-act="enregistrer" ${total && mod ? '' : 'disabled'}>Enregistrer</button>
  </div>`
}

// ─── Actions ────────────────────────────────────────────────────
function aller(e) {
  if (e === 'plus') { etat.plusOuvert = true; rendu(); return }
  if (e === 'clients') e = 'commandes'
  etat.ecran = e; etat.plusOuvert = false; etat.saisieOuverte = false; etat.selection = null; rendu(); window.scrollTo(0, 0)
}
let dernierAjout = null
function toast(txt, annuler) {
  const t = document.getElementById('toast')
  document.getElementById('toast-txt').textContent = txt
  const b = document.getElementById('toast-annuler')
  b.style.display = annuler ? '' : 'none'
  b.onclick = () => { annuler(); t.classList.remove('visible') }
  t.classList.add('visible')
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('visible'), 5000)
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-cat],[data-statut-saisie],[data-livmod],[data-livf],[data-nav],[data-act],[data-onglet],[data-filtre],[data-pointer],[data-ouvrir],[data-liv],[data-mode],[data-marque],[data-modele],[data-pt],[data-statut]')
  if (!el) return
  const d = el.dataset
  if (d.nav) return aller(d.nav)
  if (d.pointer) { ev.stopPropagation(); if (!DIRECTION) return; const e = ENTREES.find(x => x.id == d.pointer); e.pointe = !e.pointe; rendu(); return toast(e.pointe ? 'Entrée pointée' : 'Entrée dépointée', () => { e.pointe = !e.pointe; rendu() }) }
  if (d.onglet) { etat.onglet = d.onglet; return rendu() }
  if (d.filtre) { etat.filtre = d.filtre; return rendu() }
  if (d.ouvrir) {
    etat.selection = +d.ouvrir; etat.saisieOuverte = false
    if (!(etat.dir === 'A' && window.innerWidth >= 1100)) return ouvrirDetailFeuille()
    return rendu()
  }
  if (d.liv) { etat.livOuverte = etat.livOuverte === d.liv ? null : d.liv; etat.livModele = null; return rendu() }
  if (d.livmod) { etat.livModele = etat.livModele === d.livmod ? null : d.livmod; return rendu() }
  if (d.livf) { etat.livFiltre = d.livf; return rendu() }
  if (d.statut) { const e = ENTREES.find(x => x.id === etat.selection); e.statut = d.statut; rendu(); if (document.querySelector('.feuille.detail')) ouvrirDetailFeuille(); return toast('Statut : ' + d.statut) }
  if (d.mode) { form.mode = d.mode; form.qte = {}; return rendu() }
  if (d.marque) { form = nouveauForm(d.marque, { numero: form.numero }); return rendu() }
  if (d.modele) { form.modele = d.modele; form.grille = MARQUES[form.marque].modeles[d.modele].grille; form.qte = {}
    form.categorie = CAT_DE_GRILLE[form.grille] || ''; form.categorieAuto = !!form.categorie; return rendu() }
  if (d.cat) { form.categorie = d.cat; form.categorieAuto = false; return rendu() }
  if (d.statutSaisie !== undefined) { form.statut = d.statutSaisie; return rendu() }
  if (d.pt) { const q = form.qte[d.pt] || 0; const n = form.retirer ? Math.max(0, q - 1) : q + 1; if (n) form.qte[d.pt] = n; else delete form.qte[d.pt]; return rendu() }
  switch (d.act) {
    case 'nouvelle': case 'nouvelle-depuis-accueil':
      etat.ecran = 'entrees'; etat.onglet = 'entrees'; etat.selection = null; etat.saisieOuverte = true; return rendu()
    case 'fermer-saisie': etat.saisieOuverte = false; return rendu()
    case 'fermer-detail': etat.selection = null; document.querySelectorAll('.feuille.detail,.feuille-fond.detail').forEach(x => x.remove()); return rendu()
    case 'fermer-plus': etat.plusOuvert = false; return rendu()
    case 'filtres': etat.filtresOuverts = true; return rendu()
    case 'fermer-filtres': etat.filtresOuverts = false; return rendu()
    case 'raz-filtres': etat.f = { categorie:'', statut:'', marque:'', magasin:'', pointe:'' }; return rendu()
    case 'choisir-marque': form.choixMarque = true; return rendu()
    case 'changer-modele': form.modele = null; form.qte = {}; return rendu()
    case 'mode-ajout': form.retirer = false; return rendu()
    case 'mode-retrait': form.retirer = true; return rendu()
    case 'vider': form.qte = {}; return rendu()
    case 'tout-reste': { const mod = MARQUES[form.marque].modeles[form.modele]; form.qte = {}; Object.keys(mod.attendu).forEach(t => { const r = (mod.attendu[t]||0) - (mod.recu[t]||0); if (r > 0) form.qte[t] = r }); return rendu() }
    case 'enregistrer': {
      const mod = MARQUES[form.marque].modeles[form.modele], retour = form.mode === 'retour'
      const tot = Object.values(form.qte).reduce((s, v) => s + v, 0) * (retour ? -1 : 1)
      const sizes = Object.fromEntries(Object.entries(form.qte).map(([k, v]) => [k, retour ? -v : v]))
      const e = { id: Date.now(), magasin: MAGASIN_APPAREIL, categorie: form.categorie, date: AUJ, marque: form.marque, modele: form.modele, numero: form.numero, paires: tot, montant: Math.round(mod.prix * tot * 100) / 100, statut: retour ? 'Retour' : form.statut, pointe: false, sizes, grille: form.grille }
      ENTREES.unshift(e)
      if (!retour) Object.entries(form.qte).forEach(([k, v]) => mod.recu[k] = (mod.recu[k] || 0) + v)
      form = nouveauForm(form.marque, { numero: form.numero, grille: form.grille, statut: form.statut })   // on garde marque, N°, date et grille : carton suivant
      rendu()
      return toast(`Enregistrée : ${e.marque} · ${e.modele}, ${e.paires} paire${Math.abs(e.paires) > 1 ? 's' : ''}`, () => { ENTREES = ENTREES.filter(x => x.id !== e.id); rendu() })
    }
  }
})
function ouvrirDetailFeuille() {
  document.querySelectorAll('.feuille.detail,.feuille-fond.detail').forEach(x => x.remove())
  const fond = document.createElement('div'); fond.className = 'feuille-fond ouvert detail'; fond.dataset.act = 'fermer-detail'
  const f = document.createElement('div'); f.className = 'feuille ouvert detail'; f.setAttribute('role', 'dialog'); f.innerHTML = contenuDetail()
  document.body.append(fond, f)
}
document.addEventListener('change', ev => {
  const t = ev.target
  if (t.dataset.f !== undefined) { etat.f[t.dataset.f] = t.value; return rendu() }
  if (t.dataset.livmag !== undefined) { etat.livMag = t.value; etat.livOuverte = null; etat.livModele = null; return rendu() }
})
document.addEventListener('input', ev => {
  if (ev.target.id === 'livq') {
    etat.livQ = ev.target.value
    const pos = ev.target.selectionStart; rendu()
    const r = document.getElementById('livq'); r.focus(); r.setSelectionRange(pos, pos)
    return
  }
  if (ev.target.id === 'recherche') {
    etat.recherche = ev.target.value
    const pos = ev.target.selectionStart; rendu()
    const r = document.getElementById('recherche'); r.focus(); r.setSelectionRange(pos, pos)
  }
})
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { etat.saisieOuverte = false; etat.plusOuvert = false; etat.filtresOuverts = false; etat.selection = null; document.querySelectorAll('.feuille.detail,.feuille-fond.detail').forEach(x => x.remove()); rendu() } })
window.addEventListener('resize', () => rendu())
rendu()
</script>
</body>
</html>
